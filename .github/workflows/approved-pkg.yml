name: Package approved TheFunkBoxx 1.3.1
on:
  push:
    branches: [packaging/approved-thefunkboxx-pkg]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact approved notarized installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p approved-input
          gh release download developer-id-892e088c0beb --repo "$GITHUB_REPOSITORY" --pattern TheFunkBoxx-macOS-Installer.dmg --dir approved-input
          mv approved-input/TheFunkBoxx-macOS-Installer.dmg approved-input/Approved-TheFunkBoxx-1.3.1.dmg
          echo 'b0dd509f62d8f7657f99cb4fde822b8941da4582b4394b46b234114fc3389cbc  approved-input/Approved-TheFunkBoxx-1.3.1.dmg' | shasum -a 256 -c -
      - name: Package approved AU, VST3, standalone and presets
        env:
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-approved-ci.sh
      - name: Test installer on disposable macOS runner
        run: |
          set -euo pipefail
          package=$(find approved-input -name '*-SIGNED.pkg' -print -quit)
          if [ -z "$package" ]; then package=$(find approved-input -name '*-UNSIGNED.pkg' -print -quit); fi
          test -n "$package" || { echo "::error::No package produced"; exit 1; }
          sudo installer -showChoicesXML -pkg "$package" -target / > approved-input/installer-choices.xml
          sudo installer -pkg "$package" -target /
          for bundle in /Applications/TheFunkBoxx.app /Library/Audio/Plug-Ins/Components/TheFunkBoxx.component /Library/Audio/Plug-Ins/VST3/TheFunkBoxx.vst3; do
            echo "Verifying installed bundle: $bundle"
            test -d "$bundle" || { echo "::error::Missing installed bundle: $bundle"; pkgutil --pkgs | grep thefunkboxx || true; exit 1; }
            codesign --verify --deep --strict "$bundle"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = 1.3.1
            lipo "$bundle/Contents/MacOS/TheFunkBoxx" -verify_arch arm64 x86_64
          done
          sudo installer -pkg "$package" -target /
          /usr/bin/auval -v aumu FnBx PhZk
      - name: Retain package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TheFunkBoxx-1.3.1-PKG
          path: |
            approved-input/Output-*/*
            approved-input/installer-choices.xml
          if-no-files-found: error
