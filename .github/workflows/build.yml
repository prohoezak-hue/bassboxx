name: Build BASSBOXX macOS app and VST3
on:
  push:
    branches: [main, fix/vst3-host-load-validation]
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bassboxx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    name: Universal macOS app, VST3, tests and ZIPs
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check manual distribution setup before building
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[notarize]'))
        env:
          HAVE_APPLICATION: ${{ secrets.MAC_APPLICATION_P12_BASE64 != '' }}
          HAVE_APPLICATION_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD != '' }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAVE_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for setting in HAVE_APPLICATION HAVE_APPLICATION_PASSWORD HAVE_APPLE_ID HAVE_NOTARY_PASSWORD; do
            if [[ "${!setting}" != true ]]; then
              echo "::error::Missing Developer ID configuration ($setting). Follow docs/Apple-Signing-Setup.md before running a manual distribution."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Build and test native installer app
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/native-installer.log bash scripts/build-native-installer.sh build/native-installer
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent 'build/native-installer/Install BASSBOXX.app' dist/BASSBOXX-native-installer-build.zip
          (cd dist && shasum -a 256 BASSBOXX-native-installer-build.zip > BASSBOXX-native-installer-build.zip.sha256)
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          # VST SDK 3.7.14 build 55, including its pinned SDK submodules.
          ref: 43b4e366ff84afc9b4247776acbf5e234683b77f
          path: .validator-tools/vst3sdk
      - uses: actions/checkout@v4
        with:
          repository: Tracktion/pluginval
          # pluginval 1.0.4; recursive checkout uses the pinned JUCE gitlink.
          ref: ed19c2c16b57a6d94db391bea3ef4a80b769d5bf
          submodules: recursive
          path: .validator-tools/pluginval
      - name: Build pinned external validators
        id: validator-tools
        run: |
          git -C .validator-tools/vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S .validator-tools/vst3sdk -B "$RUNNER_TEMP/vst3sdk-build" \
            -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_CODE_SIGN_IDENTITY_MAC=-
          cmake --build "$RUNNER_TEMP/vst3sdk-build" --config Release --target validator --parallel 3
          cmake -S .validator-tools/pluginval -B "$RUNNER_TEMP/pluginval-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/pluginval-build" --config Release --target pluginval --parallel 3
      - name: Configure Apple Silicon and Intel app and VST3
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build plugin and test executables
        id: plugin-build
        run: python3 scripts/run-validator.py 1200 build/validator-logs/build.log cmake --build build --config Release --parallel 3
      - name: Run engine, processor and real VST3 host loading tests and render the editor
        run: |
          python3 scripts/run-validator.py 360 build/validator-logs/native-tests.log ctest --test-dir build -C Release --output-on-failure --timeout 120
          python3 scripts/run-validator.py 360 build/validator-logs/repeated-host-tests.log ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3 -R 'vst3_scan|vst3_host_load|standalone'
          python3 scripts/run-validator.py 120 build/validator-logs/editor-render.log build/plugin_tests "$RUNNER_TEMP/BASSBOXX-interface.png"
          mkdir -p dist
          cp "$RUNNER_TEMP/BASSBOXX-interface.png" dist/BASSBOXX-interface.png
      - name: Steinberg VST3 Validator
        if: ${{ !cancelled() && steps.validator-tools.outcome == 'success' && steps.plugin-build.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/steinberg.log \
            "$RUNNER_TEMP/vst3sdk-build/bin/Release/validator" \
            "$PWD/build/BASSBOXX_artefacts/Release/VST3/BASSBOXX.vst3"
      - name: pluginval strictness 5 (including editor tests)
        if: ${{ !cancelled() && steps.validator-tools.outcome == 'success' && steps.plugin-build.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/pluginval-console.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/pluginval" \
            --validate "$PWD/build/BASSBOXX_artefacts/Release/VST3/BASSBOXX.vst3"
      - name: Verify, sign, test installer, and package ZIP
        id: package
        run: python3 scripts/run-validator.py 1800 build/validator-logs/package.log bash scripts/package-macos.sh
      - name: Steinberg validator on locally built and installed VST3
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/local-steinberg.log \
            "$RUNNER_TEMP/vst3sdk-build/bin/Release/validator" "$PWD/build/local-installed/BASSBOXX.vst3"
      - name: pluginval on locally built and installed VST3
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/local-pluginval-console.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/local-pluginval" --validate "$PWD/build/local-installed/BASSBOXX.vst3"
      - name: pluginval on registered Audio Unit
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/au-pluginval.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/au-pluginval" --validate 'AudioUnit:Synths/aumu,BsBx,PhZk'
      - uses: actions/upload-artifact@v4
        with:
          name: BASSBOXX-macOS-products
          path: |
            dist/BASSBOXX-macOS-AU.zip
            dist/BASSBOXX-macOS-AU.zip.sha256
            dist/BASSBOXX-macOS-VST3.zip
            dist/BASSBOXX-macOS-VST3.zip.sha256
            dist/BASSBOXX-macOS-Standalone.zip
            dist/BASSBOXX-macOS-Standalone.zip.sha256
            dist/BASSBOXX-interface.png
            dist/BASSBOXX-native-installer-build.zip
            dist/BASSBOXX-native-installer-build.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BASSBOXX-macOS-test-evidence
          path: |
            build/Testing/Temporary/LastTest.log
            build/validator-logs/
            build/native-installer/smoke.json
            build/standalone-report.json
            build/standalone-extracted-report.json
            build/local-build-test-run.*/**/Build.log
            build/local-build-test-run.*/**/installed-standalone.json
            ${{ runner.temp }}/BASSBOXX-interface.png
          if-no-files-found: error
  engine:
    name: Portable DSP regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBASSBOXX_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  publish:
    name: Publish downloadable app and plugin
    needs: [mac, engine]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/vst3-host-load-validation') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BASSBOXX-macOS-products
          path: dist
      - name: Publish tested ZIP as a versioned development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="macos-${BUILD_SHA:0:12}"
          cat > release-notes.md <<EOF_NOTES
          BASSBOXX by ProHoeZak — standalone macOS synthesizer, AU and VST3 instruments.

          **Standalone app:** download **BASSBOXX-macOS-Standalone.zip**, extract the whole folder, and open **BASSBOXX.app**. MPC is not required. Choose **Options > Audio/MIDI Settings** for your output device and MIDI controller; the original on-screen keyboard also works.
          **Local build/install:** the standalone ZIP includes **Build BASSBOXX on this Mac.command**. It builds the original instrument using free Apple Command Line Tools and the included verified dependencies, runs the tests, and installs the app in your home Applications folder. No paid Apple membership or code editing is needed. If Apple's tools installer opens, complete it and rerun the builder.
          **Audio Unit for MPC:** download **BASSBOXX-macOS-AU.zip**. Quit MPC, extract the whole folder, and follow Installation.txt. The free local-build helper installs BASSBOXX.component in your user Audio Units folder and runs Apple's auval plus actual AU hosting checks. Restart MPC, leave **Use Audio Units** checked, choose **Rescan All**, and look for BASSBOXX as an AU instrument. This alternate format addresses the reported Ignore/Skipped VST3 scan route; a successful MPC scan and playback are still required before claiming compatibility.
          **VST3:** the separate **BASSBOXX-macOS-VST3.zip** is for MPC/other VST3 hosts and retains the VST3 local-build route.

          New in 1.2.0: a native AU instrument using the same editor and processor, with Apple auval and actual AU MIDI/audio/state/editor validation. The 1.1.1 features are retained: dark wood and gold panel styled after the supplied design, up/down sound browsing arrows immediately before the factory dropdown (with wraparound), Poly/Mono switch with last-note legato, spring-return ±2-semitone pitch wheel, and a hold-position modulation wheel for 5 Hz vibrato (up to ±0.5 semitone). Hardware MIDI pitch bend and CC1 are supported. The original synthesis controls and 100 factory patch definitions remain available. Mono uses one voice; switching back restores the chosen poly voice count. Live wheel positions are not saved into patches.

          Universal arm64/x86_64, macOS 11+. CI passed engine/processor/VST3 scan/host tests, real standalone application launch with visible original editor and MIDI stereo rendering, Steinberg VST3 Validator and pluginval, installer/upgrade and quarantine/tamper rejection tests for both products, extracted-app startup, and the packaged local app build/install route. The AU also passed Apple's auval and pluginval after registry installation. The existing factory timbres and controls are preserved, with the new vintage skin and performance controls. The attached BASSBOXX-interface.png is rendered from the real editor.

          All downloads are ad-hoc signed development builds, not Developer ID signed/notarized. A standalone app does not fix Apple's distribution trust rejection. macOS may block the app/helper; if it does, stop and retain the exact message. No quarantine or security protections are removed or disabled. Live playback, hardware MIDI and policy behavior on your own Mac require local testing. MPC 3.10 compatibility remains unverified for the VST3; the standalone app does not use MPC.

          Source commit: ${BUILD_SHA}
          EOF_NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/BASSBOXX-macOS-*.zip dist/BASSBOXX-macOS-*.zip.sha256 dist/BASSBOXX-interface.png --clobber
          else
            gh release create "$tag" dist/BASSBOXX-macOS-*.zip dist/BASSBOXX-macOS-*.zip.sha256 dist/BASSBOXX-interface.png --target "$BUILD_SHA" --title "BASSBOXX macOS standalone and VST3 ${BUILD_SHA:0:7}" --prerelease --latest=false --notes-file release-notes.md
          fi
          echo "Download: https://github.com/${GH_REPO}/releases/download/${tag}/BASSBOXX-macOS-Standalone.zip" >> "$GITHUB_STEP_SUMMARY"
  developer_id:
    name: Sign and notarize Mac installer app
    needs: [mac, engine]
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[notarize]'))) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/vst3-host-load-validation')
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BASSBOXX-macOS-products
          path: validated-artifacts
      - name: Developer ID signing, notarization and native installer verification
        env:
          MAC_APPLICATION_P12_BASE64: ${{ secrets.MAC_APPLICATION_P12_BASE64 }}
          MAC_APPLICATION_P12_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-developer-id.sh validated-artifacts signed-dist
      - name: Retain notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASSBOXX-Developer-ID-evidence
          path: |
            signed-dist/notarization*.json
            build/native-installer/smoke.json
            signed-dist/Build-info.json
          if-no-files-found: ignore
      - name: Publish accepted and stapled installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="developer-id-${GITHUB_SHA:0:12}"
          cat > signed-release-notes.md <<'NOTES'
          BASSBOXX AU and VST3 for macOS 11+, Apple Silicon and Intel.

          Download BASSBOXX-macOS-Installer.dmg, open it, then open Install BASSBOXX.app and click Install. Quit MPC first. The app installs AU/VST3 into your user Library/Audio/Plug-Ins folders and backs up previous copies. The standalone app is not changed. No private-key setup, command-file helper, administrator password or local compilation is required on the receiving Mac.

          The installer app, plugins and disk image are Developer ID Application signed for team 5QF6Q5ATG5. Apple accepted the app and disk image for notarization; their tickets are stapled and Gatekeeper assessments passed. Native installer tests cover first install, upgrade backups, signature rejection, rollback after a partial installation and preservation of unrelated files. The existing engine, processor, standalone, AU/VST3 hosting, Apple auval, Steinberg Validator and pluginval regressions passed first.

          Restart MPC, keep Use Audio Units checked and choose Rescan All. Select BASSBOXX as an AU instrument. MPC scanning, playback and project recall still require verification on your Mac; notarization is not MPC certification.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" signed-dist/BASSBOXX-macOS-Installer.dmg signed-dist/BASSBOXX-macOS-Installer.dmg.sha256 signed-dist/Build-info.json --clobber
          else
            gh release create "$tag" signed-dist/BASSBOXX-macOS-Installer.dmg signed-dist/BASSBOXX-macOS-Installer.dmg.sha256 signed-dist/Build-info.json --target "$GITHUB_SHA" --title 'BASSBOXX notarized Mac installer' --prerelease --latest=false --notes-file signed-release-notes.md
          fi
