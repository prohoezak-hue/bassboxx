name: Build TheFunkBoxx macOS app and VST3
on:
  push:
    branches: [main, fix/vst3-host-load-validation, feat/thefunkboxx]
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bassboxx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[installer-only]')) }}
    name: Universal macOS app, VST3, tests and ZIPs
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check manual distribution setup before building
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[notarize]'))
        env:
          HAVE_APPLICATION: ${{ secrets.MAC_APPLICATION_P12_BASE64 != '' }}
          HAVE_APPLICATION_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD != '' }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAVE_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for setting in HAVE_APPLICATION HAVE_APPLICATION_PASSWORD HAVE_APPLE_ID HAVE_NOTARY_PASSWORD; do
            if [[ "${!setting}" != true ]]; then
              echo "::error::Missing Developer ID configuration ($setting). Follow docs/Apple-Signing-Setup.md before running a manual distribution."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Build and test native installer app
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/native-installer.log bash scripts/build-native-installer.sh build/native-installer
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent 'build/native-installer/Install TheFunkBoxx.app' dist/TheFunkBoxx-native-installer-build.zip
          (cd dist && shasum -a 256 TheFunkBoxx-native-installer-build.zip > TheFunkBoxx-native-installer-build.zip.sha256)
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          # VST SDK 3.7.14 build 55, including its pinned SDK submodules.
          ref: 43b4e366ff84afc9b4247776acbf5e234683b77f
          path: .validator-tools/vst3sdk
      - uses: actions/checkout@v4
        with:
          repository: Tracktion/pluginval
          # pluginval 1.0.4; recursive checkout uses the pinned JUCE gitlink.
          ref: ed19c2c16b57a6d94db391bea3ef4a80b769d5bf
          submodules: recursive
          path: .validator-tools/pluginval
      - name: Build pinned external validators
        id: validator-tools
        run: |
          git -C .validator-tools/vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S .validator-tools/vst3sdk -B "$RUNNER_TEMP/vst3sdk-build" \
            -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_CODE_SIGN_IDENTITY_MAC=-
          cmake --build "$RUNNER_TEMP/vst3sdk-build" --config Release --target validator --parallel 3
          cmake -S .validator-tools/pluginval -B "$RUNNER_TEMP/pluginval-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/pluginval-build" --config Release --target pluginval --parallel 3
      - name: Configure Apple Silicon and Intel app and VST3
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build plugin and test executables
        id: plugin-build
        run: python3 scripts/run-validator.py 1200 build/validator-logs/build.log cmake --build build --config Release --parallel 3
      - name: Run engine, processor and real VST3 host loading tests and render the editor
        run: |
          python3 scripts/run-validator.py 360 build/validator-logs/native-tests.log ctest --test-dir build -C Release --output-on-failure --timeout 120
          python3 scripts/run-validator.py 360 build/validator-logs/repeated-host-tests.log ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3 -R 'vst3_scan|vst3_host_load|standalone'
          python3 scripts/run-validator.py 120 build/validator-logs/editor-render.log build/plugin_tests "$RUNNER_TEMP/TheFunkBoxx-interface.png"
          mkdir -p dist
          cp "$RUNNER_TEMP/TheFunkBoxx-interface.png" dist/TheFunkBoxx-interface.png
      - name: Steinberg VST3 Validator
        if: ${{ !cancelled() && steps.validator-tools.outcome == 'success' && steps.plugin-build.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/steinberg.log \
            "$RUNNER_TEMP/vst3sdk-build/bin/Release/validator" \
            "$PWD/build/TheFunkBoxx_artefacts/Release/VST3/TheFunkBoxx.vst3"
      - name: pluginval strictness 5 (including editor tests)
        if: ${{ !cancelled() && steps.validator-tools.outcome == 'success' && steps.plugin-build.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/pluginval-console.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/pluginval" \
            --validate "$PWD/build/TheFunkBoxx_artefacts/Release/VST3/TheFunkBoxx.vst3"
      - name: Verify, sign, test installer, and package ZIP
        id: package
        run: python3 scripts/run-validator.py 1800 build/validator-logs/package.log bash scripts/package-macos.sh
      - name: Steinberg validator on locally built and installed VST3
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 180 build/validator-logs/local-steinberg.log \
            "$RUNNER_TEMP/vst3sdk-build/bin/Release/validator" "$PWD/build/local-installed/TheFunkBoxx.vst3"
      - name: pluginval on locally built and installed VST3
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/local-pluginval-console.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/local-pluginval" --validate "$PWD/build/local-installed/TheFunkBoxx.vst3"
      - name: pluginval on registered Audio Unit
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python3 scripts/run-validator.py 600 build/validator-logs/au-pluginval.log \
            "$RUNNER_TEMP/pluginval-build/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 5 --random-seed 123456 --timeout-ms 30000 \
            --output-dir "$PWD/build/validator-logs/au-pluginval" --validate 'AudioUnit:Synths/aumu,FnBx,PhZk'
      - uses: actions/upload-artifact@v4
        with:
          name: TheFunkBoxx-macOS-products
          path: |
            dist/TheFunkBoxx-macOS-AU.zip
            dist/TheFunkBoxx-macOS-AU.zip.sha256
            dist/TheFunkBoxx-macOS-VST3.zip
            dist/TheFunkBoxx-macOS-VST3.zip.sha256
            dist/TheFunkBoxx-macOS-Standalone.zip
            dist/TheFunkBoxx-macOS-Standalone.zip.sha256
            dist/TheFunkBoxx-interface.png
            dist/TheFunkBoxx-native-installer-build.zip
            dist/TheFunkBoxx-native-installer-build.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TheFunkBoxx-macOS-test-evidence
          path: |
            build/Testing/Temporary/LastTest.log
            build/validator-logs/
            build/native-installer/smoke.json
            build/standalone-report.json
            build/standalone-extracted-report.json
            build/local-build-test-run.*/**/Build.log
            build/local-build-test-run.*/**/installed-standalone.json
            ${{ runner.temp }}/TheFunkBoxx-interface.png
          if-no-files-found: error
  engine:
    name: Portable DSP regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBASSBOXX_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  publish:
    name: Publish downloadable app and plugin
    needs: [mac, engine]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/vst3-host-load-validation' || github.ref == 'refs/heads/feat/thefunkboxx') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TheFunkBoxx-macOS-products
          path: dist
      - name: Publish tested ZIP as a versioned development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="macos-${BUILD_SHA:0:12}"
          cat > release-notes.md <<EOF_NOTES
          TheFunkBoxx 1.3.0 by ProHoeZak — standalone, AU and VST3 for macOS 11+, Apple Silicon and Intel.

          Black textured panel, cream trim and brushed silver knobs, with 125 built-in sounds: the original 100 factory programs plus 25 original ProHoeZak presets. All original synthesis controls, Mono/Poly legato, pitch/mod wheels, hardware MIDI, automation, state recall and .bassboxx patch compatibility are retained.

          Download TheFunkBoxx-macOS-Standalone.zip for the standalone app, TheFunkBoxx-macOS-AU.zip for Audio Units, or TheFunkBoxx-macOS-VST3.zip for VST3. Extract the whole folder and follow Installation.txt. The separate notarized DMG release provides the signed standalone and native AU/VST3 installer when Apple acceptance completes.

          These ZIPs are ad-hoc signed development builds. Do not bypass macOS security protections if blocked. The screenshot is rendered from the real editor. Universal builds, DSP/processor/state/editor regressions, actual AU/VST3 hosting, standalone startup, Apple auval, Steinberg Validator, pluginval and packaging/install checks passed before publication. MPC playback and project recall still need testing on your Mac.

          Source commit: ${BUILD_SHA}
          EOF_NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/TheFunkBoxx-macOS-*.zip dist/TheFunkBoxx-macOS-*.zip.sha256 dist/TheFunkBoxx-interface.png --clobber
          else
            gh release create "$tag" dist/TheFunkBoxx-macOS-*.zip dist/TheFunkBoxx-macOS-*.zip.sha256 dist/TheFunkBoxx-interface.png --target "$BUILD_SHA" --title "TheFunkBoxx macOS standalone and VST3 ${BUILD_SHA:0:7}" --prerelease --latest=false --notes-file release-notes.md
          fi
          echo "Download: https://github.com/${GH_REPO}/releases/download/${tag}/TheFunkBoxx-macOS-Standalone.zip" >> "$GITHUB_STEP_SUMMARY"
  developer_id:
    name: Sign and notarize Mac installer app
    needs: [mac, engine]
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[notarize]'))) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/vst3-host-load-validation' || github.ref == 'refs/heads/feat/thefunkboxx')
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TheFunkBoxx-macOS-products
          path: validated-artifacts
      - name: Developer ID signing, notarization and native installer verification
        env:
          MAC_APPLICATION_P12_BASE64: ${{ secrets.MAC_APPLICATION_P12_BASE64 }}
          MAC_APPLICATION_P12_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-developer-id.sh validated-artifacts signed-dist
      - name: Retain notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TheFunkBoxx-Developer-ID-evidence
          path: |
            signed-dist/notarization*.json
            build/native-installer/smoke.json
            signed-dist/Build-info.json
          if-no-files-found: ignore
      - name: Publish accepted and stapled installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="developer-id-${GITHUB_SHA:0:12}"
          cat > signed-release-notes.md <<'NOTES'
          TheFunkBoxx 1.3.0 — AU, VST3 and standalone for macOS 11+, Apple Silicon and Intel.

          Black textured panel, cream trim, brushed silver knobs, and 125 sounds including 25 original ProHoeZak presets. Existing synthesis, parameter IDs and .bassboxx patch compatibility are retained.

          Download TheFunkBoxx-macOS-Installer.dmg, open it, then open Install TheFunkBoxx.app and click Install. Quit MPC first. The app installs AU/VST3 into your user Library/Audio/Plug-Ins folders and backs up previous copies. For standalone, drag the included TheFunkBoxx.app into Applications and open it. Existing BASSBOXX installations are left in place. No private-key setup, command-file helper, administrator password or local compilation is required on the receiving Mac.

          The installer app, plugins and disk image are Developer ID Application signed for team 5QF6Q5ATG5. Apple accepted the installer, standalone app and disk image for notarization; their tickets are stapled and Gatekeeper assessments passed. Native installer tests cover first install, upgrade backups, signature rejection, rollback after a partial installation and preservation of unrelated files. The existing engine, processor, standalone, AU/VST3 hosting, Apple auval, Steinberg Validator and pluginval regressions passed first.

          Restart MPC, keep Use Audio Units checked and choose Rescan All. Select TheFunkBoxx as an AU instrument. MPC scanning, playback and project recall still require verification on your Mac; notarization is not MPC certification.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" signed-dist/TheFunkBoxx-macOS-Installer.dmg signed-dist/TheFunkBoxx-macOS-Installer.dmg.sha256 signed-dist/Build-info.json signed-dist/TheFunkBoxx-interface.png --clobber
          else
            gh release create "$tag" signed-dist/TheFunkBoxx-macOS-Installer.dmg signed-dist/TheFunkBoxx-macOS-Installer.dmg.sha256 signed-dist/Build-info.json signed-dist/TheFunkBoxx-interface.png --target "$GITHUB_SHA" --title 'TheFunkBoxx notarized Mac installer' --prerelease --latest=false --notes-file signed-release-notes.md
          fi
