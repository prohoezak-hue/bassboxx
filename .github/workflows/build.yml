name: Build The Funk Box macOS VST3
on:
  push:
    branches: [main, funk-box-installer]
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bassboxx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    name: Universal macOS VST3, tests and installer
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Apple Silicon and Intel VST3 only
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build plugin and test executables
        run: cmake --build build --config Release --parallel 3
      - name: Run all tests and render the editor
        run: |
          ctest --test-dir build -C Release --output-on-failure
          build/plugin_tests "$RUNNER_TEMP/BASSBOXX-interface.png"
      - name: Sign and notarize customer installer
        if: github.event_name != 'pull_request'
        env:
          MAC_APPLICATION_P12_BASE64: ${{ secrets.MAC_APPLICATION_P12_BASE64 }}
          MAC_APPLICATION_P12_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/sign-installer-ci.sh
      - name: Build and verify development PKG installer
        if: github.event_name == 'pull_request'
        run: bash scripts/package-pkg-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: The-Funk-Box-macOS-PKG
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BASSBOXX-macOS-test-evidence
          path: |
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/BASSBOXX-interface.png
          if-no-files-found: error
  engine:
    name: Portable DSP regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBASSBOXX_ENGINE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
